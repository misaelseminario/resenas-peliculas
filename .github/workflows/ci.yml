# CI — integración continua.
#
# Cada vez que se sube código (push a cualquier rama) o se abre un pull request,
# una máquina limpia analiza el código y ejecuta las pruebas. Si algo falla,
# GitHub marca la subida con una ✗ roja antes de integrar el cambio.
#
# Las pruebas no necesitan Firebase ni internet: usan servicios falsos
# (test/fakes/). La publicación del APK está en release-apk.yml.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: # también a mano: pestaña Actions → «CI» → «Run workflow»

permissions:
  contents: read # este workflow solo lee el código

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter (la misma versión del desarrollo)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Descargar las dependencias
        run: flutter pub get

      - name: Analizar el código
        run: flutter analyze --no-fatal-infos

      - name: Ejecutar las pruebas
        run: flutter test

      - name: Revisar la sintaxis del servidor de IA
        run: node --check servidor-ia/servidor.js && node --check herramientas/cargar_peliculas.mjs
